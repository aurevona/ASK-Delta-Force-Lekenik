
name: Check Android project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking repository files..."
          if [ -f package.json ]; then
            echo "package.json found"
            cat package.json
          else
            echo "No package.json found"
          fi
          if [ -d android ]; then
            echo "Android folder found"
          else
            echo "Android folder missing"
          fi
          if [ -f capacitor.config.ts ] || [ -f capacitor.config.json ] || [ -f capacitor.config.js ]; then
            echo "Capacitor config found"
          else
            echo "Capacitor config missing"
          fi
